<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <defs>
    <pattern id="floorgrid_Villa Mogan" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="900" height="550" fill="#ffffff" rx="12"/>
  <rect width="900" height="550" fill="url(#floorgrid_Villa Mogan)" rx="12" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header Info -->
  <g transform="translate(45, 45)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800" fill="#0b2540">VILLA MOGAN</text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#c59e53">6+2 Müstakil Malikâne &bull; Toplam Brüt: 740 m² &bull; Net Alan: 577 m²</text>
    <text x="0" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#64748b">Göl Manzarası &bull; Özel Infinity Havuz &bull; Müstakil Geniş Bahçe</text>
  </g>

  <!-- Architectural Layout -->
  <!-- Outer Villa Wall -->
  <rect x="60" y="115" width="780" height="360" rx="6" fill="none" stroke="#0b2540" stroke-width="3"/>

  <!-- Rooms Partitioning -->
  <!-- Living Room & Terrace (Göl Cephesi) -->
  <rect x="60" y="115" width="440" height="220" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="280" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#0b2540">SALON VE GÖL TERASI</text>
  <text x="280" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#c59e53">86 m² &bull; 6.40m Tavan Yüksekliği</text>
  <rect x="80" y="270" width="400" height="50" fill="#e0f2fe" fill-opacity="0.5" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="280" y="300" text-anchor="middle" font-size="11" fill="#0284c7">Doğal Taş Zemin ve Kesintisiz Mogan Gölü Panoraması</text>

  <!-- Master Bedroom Suite -->
  <rect x="500" y="115" width="340" height="180" fill="#f1f5f9" stroke="#334155" stroke-width="2"/>
  <text x="670" y="180" text-anchor="middle" font-size="15" font-weight="700" fill="#0b2540">EBEVEYN SÜİTİ</text>
  <text x="670" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#c59e53">52 m² (Giyinme Odası ve Spa Jakuzili Banyo)</text>

  <!-- Gourmet Kitchen & Dining -->
  <rect x="60" y="335" width="250" height="140" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="185" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#0b2540">ADA GURME MUTFAK</text>
  <text x="185" y="420" text-anchor="middle" font-size="11" fill="#64748b">34 m² &bull; Gaggenau Ankastre</text>

  <!-- Wellness Courtyard / Inner Atrium -->
  <rect x="310" y="335" width="190" height="140" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="405" cy="390" r="24" fill="#a7f3d0" stroke="#059669" stroke-width="1.5"/>
  <text x="405" y="395" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">İÇ BAHÇE</text>
  <text x="405" y="430" text-anchor="middle" font-size="10" font-weight="600" fill="#059669">Biyofilik Avlu &amp; Bonsai</text>

  <!-- Guest Rooms & Hobby Suite -->
  <rect x="500" y="295" width="170" height="180" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="585" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#0b2540">MİSAFİR SÜİTİ</text>
  <text x="585" y="400" text-anchor="middle" font-size="11" fill="#64748b">28 m² &bull; Bağımsız Banyo</text>

  <!-- Wellness Spa & Private Sauna -->
  <rect x="670" y="295" width="170" height="180" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="755" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">SAUNA VE WELLNESS</text>
  <text x="755" y="400" text-anchor="middle" font-size="11" fill="#b45309">Fin Sedir Saunası</text>

  <!-- Private Infinity Pool Representation -->
  <rect x="60" y="488" width="340" height="28" rx="4" fill="#38bdf8" fill-opacity="0.7" stroke="#0284c7" stroke-width="1.5"/>
  <text x="230" y="507" text-anchor="middle" font-size="11" font-weight="700" fill="#0369a1">MÜSTAKİL TAŞMA HAVUZU (14.0 x 4.5 m)</text>
</svg>