<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="parkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e2e8f0" stroke-width="0.7"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="#fcfbf9" rx="16"/>
  <rect width="1000" height="650" fill="url(#grid)" rx="16"/>

  <!-- Lake Mogan Coastline -->
  <path d="M 0,0 Q 250,130 500,75 T 1000,110 L 1000,0 L 0,0 Z" fill="url(#lakeGrad)"/>
  <path d="M 0,0 Q 250,100 500,55 T 1000,80 L 1000,0 L 0,0 Z" fill="#0284c7" fill-opacity="0.15"/>
  <text x="500" y="42" text-anchor="middle" fill="#0284c7" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="4">MOGAN GÖLÜ KIYI BANDI VE ÖZEL YAT/KAYAK İSKELESİ</text>

  <!-- Lake Promenade Line -->
  <path d="M 0,120 Q 250,150 500,95 T 1000,135" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="6,6"/>
  <text x="820" y="125" fill="#0369a1" font-size="10" font-weight="600">4.8 KM MOGAN YÜRÜYÜŞ PARKURU</text>

  <!-- Central Park / Green Corridor -->
  <path d="M 360,130 C 380,280 400,430 430,650 L 570,650 C 540,430 520,280 500,130 Z" fill="url(#parkGrad)" opacity="0.7"/>
  <text x="465" y="380" transform="rotate(85, 465, 380)" fill="#059669" font-size="11" font-weight="700" letter-spacing="3">BLUEZONE BOTANİK EKO-KORİDOR</text>

  <!-- Zone A: Mogan Mansions (Front row) -->
  <g fill="#ffffff" stroke="#c59e53" stroke-width="2">
    <rect x="80" y="160" width="65" height="45" rx="4"/>
    <rect x="170" y="170" width="65" height="45" rx="4"/>
    <rect x="260" y="175" width="65" height="45" rx="4"/>
    <rect x="600" y="175" width="65" height="45" rx="4"/>
    <rect x="690" y="170" width="65" height="45" rx="4"/>
    <rect x="780" y="165" width="65" height="45" rx="4"/>
    <rect x="870" y="160" width="65" height="45" rx="4"/>
  </g>
  <g font-size="10" fill="#b45309" font-weight="700" text-anchor="middle">
    <text x="112" y="187">M-01</text><text x="202" y="197">M-02</text><text x="292" y="202">M-03</text>
    <text x="632" y="202">M-04</text><text x="722" y="197">M-05</text><text x="812" y="192">M-06</text><text x="902" y="187">M-07</text>
  </g>

  <!-- Zone B: Azure Villas (Second Row) -->
  <g fill="#ffffff" stroke="#0284c7" stroke-width="1.8">
    <rect x="65" y="240" width="60" height="42" rx="4"/>
    <rect x="145" y="248" width="60" height="42" rx="4"/>
    <rect x="225" y="253" width="60" height="42" rx="4"/>
    <rect x="305" y="258" width="60" height="42" rx="4"/>
    <rect x="635" y="258" width="60" height="42" rx="4"/>
    <rect x="715" y="253" width="60" height="42" rx="4"/>
    <rect x="795" y="248" width="60" height="42" rx="4"/>
    <rect x="875" y="240" width="60" height="42" rx="4"/>
  </g>
  <g font-size="9" fill="#0369a1" font-weight="700" text-anchor="middle">
    <text x="95" y="265">AZ-01</text><text x="175" y="273">AZ-02</text><text x="255" y="278">AZ-03</text><text x="335" y="283">AZ-04</text>
    <text x="665" y="283">AZ-05</text><text x="745" y="278">AZ-06</text><text x="825" y="273">AZ-07</text><text x="905" y="265">AZ-08</text>
  </g>

  <!-- Central Clubhouse & Wellness Hub -->
  <rect x="405" y="210" width="125" height="85" rx="10" fill="#0b2540" stroke="#c59e53" stroke-width="2"/>
  <text x="467" y="245" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">HANERA CLUB</text>
  <text x="467" y="265" text-anchor="middle" fill="#c59e53" font-size="9">Wellness, Spa ve Lagün</text>

  <!-- Zone C: Serene Villas (Third Row) -->
  <g fill="#ffffff" stroke="#059669" stroke-width="1.8">
    <rect x="75" y="320" width="55" height="40" rx="4"/>
    <rect x="150" y="325" width="55" height="40" rx="4"/>
    <rect x="225" y="330" width="55" height="40" rx="4"/>
    <rect x="300" y="335" width="55" height="40" rx="4"/>
    <rect x="645" y="335" width="55" height="40" rx="4"/>
    <rect x="720" y="330" width="55" height="40" rx="4"/>
    <rect x="795" y="325" width="55" height="40" rx="4"/>
    <rect x="870" y="320" width="55" height="40" rx="4"/>
  </g>
  <g font-size="9" fill="#047857" font-weight="700" text-anchor="middle">
    <text x="102" y="345">SR-01</text><text x="177" y="350">SR-02</text><text x="252" y="355">SR-03</text><text x="327" y="360">SR-04</text>
    <text x="672" y="360">SR-05</text><text x="747" y="355">SR-06</text><text x="822" y="350">SR-07</text><text x="897" y="345">SR-08</text>
  </g>

  <!-- Sports Zone & Padel / Tennis -->
  <rect x="80" y="410" width="130" height="85" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="145" y="445" text-anchor="middle" fill="#0369a1" font-size="10" font-weight="700">SPOR KOMPLEKSİ</text>
  <text x="145" y="465" text-anchor="middle" fill="#0284c7" font-size="8">Tenis ve Padel Kortları</text>

  <!-- Zone D: Aura Villas (Upper Level) -->
  <g fill="#ffffff" stroke="#475569" stroke-width="1.8">
    <rect x="240" y="420" width="55" height="40" rx="4"/>
    <rect x="310" y="425" width="55" height="40" rx="4"/>
    <rect x="635" y="425" width="55" height="40" rx="4"/>
    <rect x="705" y="420" width="55" height="40" rx="4"/>
    <rect x="775" y="415" width="55" height="40" rx="4"/>
    <rect x="845" y="410" width="55" height="40" rx="4"/>
  </g>
  <g font-size="9" fill="#334155" font-weight="700" text-anchor="middle">
    <text x="267" y="445">AU-01</text><text x="337" y="450">AU-02</text>
    <text x="662" y="450">AU-03</text><text x="732" y="445">AU-04</text><text x="802" y="440">AU-05</text><text x="872" y="435">AU-06</text>
  </g>

  <!-- Main Security Entrance & Boulevard -->
  <path d="M 467,650 L 467,520" stroke="#94a3b8" stroke-width="14" stroke-linecap="round"/>
  <path d="M 467,650 L 467,520" stroke="#ffffff" stroke-width="2" stroke-dasharray="10,10"/>
  <rect x="425" y="535" width="84" height="40" rx="6" fill="#0b2540"/>
  <text x="467" y="560" text-anchor="middle" fill="#f8fafc" font-size="9" font-weight="700">ANA GİRİŞ KAPISI</text>

  <!-- Organic Farming Plots -->
  <rect x="750" y="500" width="180" height="65" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="840" y="530" text-anchor="middle" fill="#854d0e" font-size="10" font-weight="700">PERMAKÜLTÜR VE BOSTAN</text>
  <text x="840" y="548" text-anchor="middle" fill="#ca8a04" font-size="8">Hanera Bluezone Organik Hasat</text>

  <!-- Legend -->
  <g transform="translate(45, 545)">
    <rect width="350" height="85" rx="8" fill="#ffffff" fill-opacity="0.95" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="20" cy="24" r="6" fill="#c59e53"/><text x="35" y="28" font-size="9.5" font-weight="600" fill="#1e293b">Villa Mogan (6+2 Malikâne)</text>
    <circle cx="180" cy="24" r="6" fill="#0284c7"/><text x="195" y="28" font-size="9.5" font-weight="600" fill="#1e293b">Villa Azure (5+1 Prestij)</text>
    <circle cx="20" cy="54" r="6" fill="#059669"/><text x="35" y="58" font-size="9.5" font-weight="600" fill="#1e293b">Villa Serene (4+1 Bungalov)</text>
    <circle cx="180" cy="54" r="6" fill="#475569"/><text x="195" y="58" font-size="9.5" font-weight="600" fill="#1e293b">Villa Aura (4+1 Panoramik)</text>
  </g>

  <!-- Compass / North Arrow -->
  <g transform="translate(945, 60)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="0,-16 6,0 0,3" fill="#c59e53"/>
    <polygon points="0,-16 -6,0 0,3" fill="#0b2540"/>
    <polygon points="0,16 6,0 0,-3" fill="#94a3b8"/>
    <polygon points="0,16 -6,0 0,-3" fill="#cbd5e1"/>
    <text x="0" y="-19" text-anchor="middle" font-size="9" font-weight="800" fill="#0b2540">K</text>
  </g>
</svg>